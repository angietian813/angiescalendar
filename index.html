<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule Organizer</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="app-container">
        <header class="header">
            <h1>Schedule Organizer</h1>
            <div class="current-date" id="currentDate"></div>
        </header>

        <main class="dashboard">
            <!-- Calendar Section -->
            <section class="calendar-section">
                <div class="section-header">
                    <h2>Calendar</h2>
                    <div class="view-toggle">
                        <button class="view-btn active" data-view="month">Month</button>
                        <button class="view-btn" data-view="week">Week</button>
                    </div>
                </div>
                
                <div class="calendar-controls">
                    <button class="nav-btn" id="prevBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M15 18l-6-6 6-6"/>
                        </svg>
                    </button>
                    <span class="calendar-title" id="calendarTitle"></span>
                    <button class="nav-btn" id="nextBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M9 18l6-6-6-6"/>
                        </svg>
                    </button>
                    <button class="today-btn" id="todayBtn">Today</button>
                </div>

                <div class="calendar-grid" id="calendarGrid">
                    <!-- Calendar will be rendered here -->
                </div>

                <!-- Event Modal -->
                <div class="modal-overlay" id="eventModal">
                    <div class="modal">
                        <div class="modal-header">
                            <h3 id="modalTitle">Add Event</h3>
                            <button class="close-btn" id="closeModal">&times;</button>
                        </div>
                        <form id="eventForm">
                            <div class="form-group">
                                <label for="eventTitle">Event Title</label>
                                <input type="text" id="eventTitle" required placeholder="Enter event title">
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="eventStart">Start Time</label>
                                    <input type="time" id="eventStart" required>
                                </div>
                                <div class="form-group">
                                    <label for="eventEnd">End Time</label>
                                    <input type="time" id="eventEnd" required>
                                </div>
                            </div>
                            <div class="form-group">
                                <label for="eventCategory">Category</label>
                                <select id="eventCategory" required>
                                    <option value="work">Work</option>
                                    <option value="personal">Personal</option>
                                    <option value="school">School</option>
                                </select>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn-secondary" id="cancelEvent">Cancel</button>
                                <button type="submit" class="btn-primary">Save Event</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Task Checklist Section -->
            <section class="tasks-section">
                <div class="section-header">
                    <h2>Tasks</h2>
                    <button class="add-task-btn" id="addTaskBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"/>
                        </svg>
                        Add Task
                    </button>
                </div>

                <!-- Progress Bar -->
                <div class="progress-container">
                    <div class="progress-info">
                        <span id="progressText">0 of 0 tasks completed</span>
                        <span id="progressPercent">0%</span>
                    </div>
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                </div>

                <!-- Task Filters -->
                <div class="task-filters">
                    <button class="filter-btn active" data-filter="all">All</button>
                    <button class="filter-btn" data-filter="today">Due Today</button>
                    <button class="filter-btn" data-filter="high">High Priority</button>
                    <button class="filter-btn" data-filter="completed">Completed</button>
                </div>

                <!-- Task List -->
                <div class="task-list" id="taskList">
                    <!-- Tasks will be rendered here -->
                </div>

                <!-- Task Modal -->
                <div class="modal-overlay" id="taskModal">
                    <div class="modal">
                        <div class="modal-header">
                            <h3 id="taskModalTitle">Add Task</h3>
                            <button class="close-btn" id="closeTaskModal">&times;</button>
                        </div>
                        <form id="taskForm">
                            <div class="form-group">
                                <label for="taskName">Task Name</label>
                                <input type="text" id="taskName" required placeholder="Enter task name">
                            </div>
                            <div class="form-group">
                                <label for="taskDueDate">Due Date</label>
                                <input type="date" id="taskDueDate" required>
                            </div>
                            <div class="form-row">
                                <div class="form-group">
                                    <label for="taskPriority">Priority</label>
                                    <select id="taskPriority" required>
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>
                                <div class="form-group">
                                    <label for="taskCategory">Category</label>
                                    <select id="taskCategory" required>
                                        <option value="work">Work</option>
                                        <option value="personal">Personal</option>
                                        <option value="school">School</option>
                                    </select>
                                </div>
                            </div>
                            <div class="form-actions">
                                <button type="button" class="btn-secondary" id="cancelTask">Cancel</button>
                                <button type="submit" class="btn-primary">Save Task</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
